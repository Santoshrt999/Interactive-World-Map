<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive World Atlas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    body, html { margin:0; padding:0; height:100%; background:#050814; color:#e7edf8; font-family:Inter, system-ui, sans-serif; }
    #map { position:absolute; inset:0; }
    .panel { position:absolute; top:16px; left:16px; width:320px; max-width:calc(100% - 32px); backdrop-filter: blur(22px); background: rgba(12,16,30,0.72); border:1px solid rgba(255,255,255,0.08); border-radius:22px; padding:20px; box-shadow:0 24px 80px rgba(0,0,0,0.35); z-index:1000; }
    .panel h1 { margin:0 0 12px; font-size:22px; letter-spacing:0.02em; color:#f8fbff; }
    .panel p { margin:0 0 14px; color:#a8b4d1; line-height:1.5; }
    .search-group { display:flex; gap:10px; align-items:center; }
    .search-group input { flex:1; border:none; outline:none; border-radius:14px; padding:12px 14px; background:rgba(255,255,255,0.08); color:#f8fbff; }
    .search-group button { border:none; border-radius:14px; padding:12px 18px; background:#6b5cff; color:#fff; cursor:pointer; }
    .suggestions { margin:12px 0 16px; max-height:180px; overflow:auto; border-radius:14px; border:1px solid rgba(255,255,255,0.08); background:rgba(8,12,24,0.96); }
    .suggestion { padding:12px 14px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.06); }
    .suggestion:last-child { border-bottom:none; }
    .suggestion:hover { background:rgba(255,255,255,0.06); }
    .controls { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
    .control-button { border:none; border-radius:14px; padding:10px 14px; background:rgba(255,255,255,0.08); color:#f8fbff; cursor:pointer; transition:transform .18s ease, background .18s ease; }
    .control-button.active, .control-button:hover { background:#625cff; transform:translateY(-1px); }
    .stat-card { display:grid; gap:10px; margin-top:6px; padding:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:20px; }
    .stat-card span { font-size:13px; color:#94a3b8; }
    .stat-card strong { display:block; font-size:18px; margin-top:4px; color:#eef2ff; }
    .legend { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px; }
    .legend-item { display:flex; align-items:center; gap:8px; font-size:13px; }
    .legend-swatch { width:20px; height:20px; border-radius:6px; box-shadow:0 0 0 1px rgba(255,255,255,0.08); }
    .leaflet-control-attribution, .leaflet-control-scale { color:#ccd6f6; }
    a { color:#9ca5ff; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>Interactive World Atlas</h1>
    <p>Use the search box for cities and countries, then toggle map overlays for population, climate and GDP.</p>
    <div class="search-group">
      <input id="search" placeholder="Search cities or countries..." autocomplete="off" />
      <button id="zoomHome">Home</button>
    </div>
    <div id="suggestions" class="suggestions"></div>
    <div class="controls">
      <button class="control-button active" data-mode="population">Population</button>
      <button class="control-button" data-mode="climate">Climate</button>
      <button class="control-button" data-mode="gdp">GDP</button>
    </div>
    <div class="stat-card">
      <span>Selected overlay</span>
      <strong id="currentMode">Population</strong>
      <div id="statLines" style="font-size:13px;color:#94a3b8;line-height:1.65;">
        <div>Population: 331M</div>
        <div>Climate: 12.5°C</div>
        <div>GDP: $21433B</div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const places = [
      {label:'Tokyo, Japan', lat:35.6895, lon:139.6917},
      {label:'New York, USA', lat:40.7128, lon:-74.0060},
      {label:'London, UK', lat:51.5074, lon:-0.1278},
      {label:'Paris, France', lat:48.8566, lon:2.3522},
      {label:'Sydney, Australia', lat:-33.8688, lon:151.2093},
      {label:'São Paulo, Brazil', lat:-23.5505, lon:-46.6333},
      {label:'Mumbai, India', lat:19.0760, lon:72.8777},
      {label:'Cairo, Egypt', lat:30.0444, lon:31.2357},
      {label:'Moscow, Russia', lat:55.7558, lon:37.6173},
      {label:'Toronto, Canada', lat:43.6532, lon:-79.3832},
      {label:'Berlin, Germany', lat:52.5200, lon:13.4050},
      {label:'Nairobi, Kenya', lat:-1.2921, lon:36.8219},
      {label:'Singapore', lat:1.3521, lon:103.8198},
      {label:'Cape Town, South Africa', lat:-33.9249, lon:18.4241},
      {label:'Los Angeles, USA', lat:34.0522, lon:-118.2437},
      {label:'Mexico City, Mexico', lat:19.4326, lon:-99.1332},
      {label:'Buenos Aires, Argentina', lat:-34.6037, lon:-58.3816},
      {label:'Jakarta, Indonesia', lat:-6.2088, lon:106.8456},
      {label:'Shanghai, China', lat:31.2304, lon:121.4737},
      {label:'United States', lat:38.9072, lon:-77.0369},
      {label:'Brazil', lat:-14.2350, lon:-51.9253},
      {label:'India', lat:20.5937, lon:78.9629},
      {label:'Australia', lat:-25.2744, lon:133.7751},
      {label:'South Africa', lat:-30.5595, lon:22.9375}
    ];

    const geoData = {
      type:'FeatureCollection',
      features:[
        {type:'Feature', properties:{name:'United States', population:331, climate:12.5, gdp:21433}, geometry:{type:'Polygon', coordinates:[[[ -125,24 ],[-66,24],[-66,49],[-125,49],[-125,24]]] }},
        {type:'Feature', properties:{name:'Brazil', population:213, climate:24.8, gdp:1839}, geometry:{type:'Polygon', coordinates:[[[ -74,-34],[-34,-34],[-34,5],[-74,5],[-74,-34]]] }},
        {type:'Feature', properties:{name:'India', population:1380, climate:25.2, gdp:2875}, geometry:{type:'Polygon', coordinates:[[[ 68,6],[97,6],[97,35],[68,35],[68,6]]] }},
        {type:'Feature', properties:{name:'China', population:1441, climate:14.5, gdp:14343}, geometry:{type:'Polygon', coordinates:[[[ 73,18],[135,18],[135,53],[73,53],[73,18]]] }},
        {type:'Feature', properties:{name:'Australia', population:26, climate:21.0, gdp:1393}, geometry:{type:'Polygon', coordinates:[[[ 113,-44],[154,-44],[154,-10],[113,-10],[113,-44]]] }}
      ]
    };

    const map = L.map('map', { zoomControl:true, minZoom:2 }).setView([20, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution:'&copy; OpenStreetMap contributors', maxZoom:19
    }).addTo(map);

    let overlayMode = 'population';
    const overlayLayer = L.geoJSON(geoData, { style: styleFeature, onEachFeature }).addTo(map);

    function styleFeature(feature) {
      return {
        fillColor: getOverlayColor(feature.properties),
        color: '#1f2430',
        weight: 1.5,
        fillOpacity: 0.78,
        dashArray: '3',
      };
    }

    function getOverlayColor(properties) {
      if (overlayMode === 'population') {
        const value = properties.population;
        return value > 1000 ? '#ff4655' : value > 300 ? '#ff8b3d' : '#ffd43b';
      }
      if (overlayMode === 'climate') {
        const value = properties.climate;
        return value > 22 ? '#ff61a6' : value > 15 ? '#6f8bff' : '#33d6ff';
      }
      if (overlayMode === 'gdp') {
        const value = properties.gdp;
        return value > 10000 ? '#6c5ce7' : value > 2000 ? '#4cd137' : '#1abc9c';
      }
      return '#7f8c8d';
    }

    function onEachFeature(feature, layer) {
      layer.on({
        click: () => {
          const p = feature.properties;
          updateStatCard(`${p.name} — ${overlayMode.charAt(0).toUpperCase()+overlayMode.slice(1)}`,
            `Population: ${p.population}M`, `Climate: ${p.climate}°C`, `GDP: $${p.gdp}B`);
        }
      });
    }

    function updateOverlay() {
      overlayLayer.setStyle(styleFeature);
      updateCurrentMode();
      updateLegend();
    }

    function updateCurrentMode() {
      document.getElementById('currentMode').textContent = overlayMode.charAt(0).toUpperCase() + overlayMode.slice(1);
    }

    function updateLegend() {
      const legend = document.getElementById('legend');
      legend.innerHTML = '';
      const stops = overlayMode === 'population'
        ? [{color:'#ff4655', label:'>1000M'},{color:'#ff8b3d', label:'300-1000M'},{color:'#ffd43b', label:'<300M'}]
        : overlayMode === 'climate'
          ? [{color:'#ff61a6', label:'Hot (>22°C)'},{color:'#6f8bff', label:'Warm (15-22°C)'},{color:'#33d6ff', label:'Cool (<15°C)'}]
          : [{color:'#6c5ce7', label:'High GDP'},{color:'#4cd137', label:'Medium GDP'},{color:'#1abc9c', label:'Low GDP'}];
      stops.forEach(item => {
        const badge = document.createElement('div');
        badge.className = 'legend-item';
        badge.innerHTML = `<span class='legend-swatch' style='background:${item.color}'></span>${item.label}`;
        legend.appendChild(badge);
      });
    }

    function updateStatCard(title, line1, line2, line3) {
      document.getElementById('currentMode').textContent = title;
      document.getElementById('statLines').innerHTML = `<div>${line1}</div><div>${line2}</div><div>${line3}</div>`;
      updateLegend();
    }

    document.querySelectorAll('.control-button').forEach(button => {
      button.addEventListener('click', () => {
        overlayMode = button.dataset.mode;
        document.querySelectorAll('.control-button').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        overlayLayer.setStyle(styleFeature);
        updateOverlay();
      });
    });

    const searchInput = document.getElementById('search');
    const suggestions = document.getElementById('suggestions');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim().toLowerCase();
      suggestions.innerHTML = '';
      if (!query) return;
      places.filter(item => item.label.toLowerCase().includes(query)).slice(0, 6).forEach(item => {
        const div = document.createElement('div');
        div.className = 'suggestion';
        div.textContent = item.label;
        div.addEventListener('click', () => {
          map.setView([item.lat, item.lon], 5, { animate:true });
          searchInput.value = item.label;
          suggestions.innerHTML = '';
        });
        suggestions.appendChild(div);
      });
    });

    document.getElementById('zoomHome').addEventListener('click', () => {
      map.setView([20, 0], 2, { animate:true });
      searchInput.value = '';
      suggestions.innerHTML = '';
    });

    updateLegend();
  </script>
</body>
</html>
