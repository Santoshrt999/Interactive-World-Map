<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Geography Intelligence</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    :root {
      --bg:           #02040e;
      --panel:        rgba(6, 10, 26, 0.88);
      --panel-border: rgba(255,255,255,0.07);
      --text:         #e8f0ff;
      --muted:        #5a7498;
      --accent:       #7c6dfa;
      --accent2:      #00d2d3;
      --success:      #00b894;
      --warning:      #fdcb6e;
      --card-bg:      rgba(255,255,255,0.04);
      --card-border:  rgba(255,255,255,0.07);
      --sidebar-w:    380px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }

    /* star field */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.12) .5px, transparent .5px),
        radial-gradient(circle, rgba(255,255,255,.08) .5px, transparent .5px),
        radial-gradient(circle, rgba(255,255,255,.10) .5px, transparent .5px),
        radial-gradient(circle, rgba(255,255,255,.06) .5px, transparent .5px),
        radial-gradient(circle, rgba(255,255,255,.09) .5px, transparent .5px),
        radial-gradient(circle, rgba(255,255,255,.07) .5px, transparent .5px),
        radial-gradient(circle, rgba(255,255,255,.11) .5px, transparent .5px),
        radial-gradient(circle, rgba(255,255,255,.05) .5px, transparent .5px);
      background-size: 320px 320px, 240px 240px, 280px 280px, 200px 200px,
                       350px 350px, 180px 180px, 300px 300px, 220px 220px;
      background-position: 15% 25%, 85% 15%, 45% 75%, 70% 55%,
                           25% 65%, 92% 80%, 60% 10%, 38% 42%;
    }

    #map { position: fixed; inset: 0; z-index: 1; }

    /* ── Sidebar ─────────────────────────────────────────────────────────── */
    #sidebar {
      position: fixed; top: 0; left: 0; height: 100vh;
      width: var(--sidebar-w); z-index: 100;
      display: flex; flex-direction: column; gap: 12px;
      padding: 20px 16px 24px;
      background: var(--panel);
      backdrop-filter: blur(40px) saturate(1.6);
      -webkit-backdrop-filter: blur(40px) saturate(1.6);
      border-right: 1px solid var(--panel-border);
      overflow-y: auto; scrollbar-width: none;
      animation: slideInLeft .55s cubic-bezier(.16,1,.3,1) both;
    }
    #sidebar::-webkit-scrollbar { display: none; }
    @keyframes slideInLeft { from { transform: translateX(-100%); opacity: 0; } }

    /* header */
    .hd-title { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
    .hd-sub   { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
    .pulse-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--success); margin-right: 5px;
      box-shadow: 0 0 5px var(--success);
      animation: blink 2.2s ease infinite;
    }
    @keyframes blink { 50% { opacity: .3; } }

    /* tabs */
    .tab-nav { display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; }
    .tab-btn {
      border: 1px solid transparent; border-radius: 10px;
      padding: 9px 4px; background: var(--card-bg); color: var(--muted);
      cursor: pointer; font-size: 11px; font-weight: 600; text-align: center;
      transition: all .18s ease; letter-spacing: .02em;
    }
    .tab-btn:hover { background: rgba(255,255,255,.07); color: var(--text); }
    .tab-btn.active {
      background: linear-gradient(135deg,rgba(124,109,250,.3),rgba(0,210,211,.15));
      border-color: rgba(124,109,250,.4); color: var(--text);
      box-shadow: 0 0 14px rgba(124,109,250,.2);
    }

    /* search */
    .search-wrap { position: relative; }
    .search-wrap input {
      width: 100%; border: 1px solid var(--card-border); border-radius: 12px;
      padding: 11px 14px; background: var(--card-bg); color: var(--text);
      font-size: 13px; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .search-wrap input:focus {
      border-color: rgba(124,109,250,.5);
      box-shadow: 0 0 0 3px rgba(124,109,250,.1);
    }
    .search-wrap input::placeholder { color: var(--muted); }
    #suggestions {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: rgba(8,12,28,.98); border: 1px solid var(--card-border);
      border-radius: 12px; overflow: hidden; z-index: 200;
      max-height: 180px; overflow-y: auto; display: none;
    }
    #suggestions.open { display: block; }
    .sug-item {
      padding: 10px 14px; cursor: pointer; font-size: 13px;
      border-bottom: 1px solid var(--card-border);
      transition: background .12s;
    }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:hover { background: rgba(124,109,250,.16); }

    /* overlay buttons */
    .overlay-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .overlay-btn {
      border: 1px solid var(--card-border); border-radius: 12px;
      padding: 13px 6px; background: var(--card-bg); color: var(--text);
      cursor: pointer; font-size: 11px; font-weight: 600; text-align: center;
      line-height: 1.4; transition: all .2s cubic-bezier(.16,1,.3,1);
    }
    .overlay-btn .icon { display: block; font-size: 20px; margin-bottom: 5px; }
    .overlay-btn:hover  { background: rgba(255,255,255,.07); transform: translateY(-1px); }
    .overlay-btn.active {
      background: linear-gradient(135deg,rgba(124,109,250,.32),rgba(0,210,211,.18));
      border-color: rgba(124,109,250,.5);
      box-shadow: 0 4px 22px rgba(124,109,250,.22), inset 0 1px 0 rgba(255,255,255,.08);
      transform: translateY(-1px);
    }

    /* stats */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; padding: 14px 12px;
      transition: background .18s;
    }
    .stat-card:hover { background: rgba(255,255,255,.06); }
    .stat-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
    .stat-val   { font-size: 20px; font-weight: 800; line-height: 1; transition: opacity .25s; }
    .stat-sub   { font-size: 10px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* legend */
    .legend-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    .legend-bar   { height: 8px; border-radius: 100px; margin-bottom: 4px; transition: background 0.5s ease; }
    .legend-ticks { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }

    /* source */
    .source-wrap {
      font-size: 10px; color: var(--muted); line-height: 1.7;
      padding: 10px 12px; background: var(--card-bg);
      border-radius: 10px; border: 1px solid var(--card-border);
    }
    .source-wrap a { color: var(--accent2); text-decoration: none; }
    .source-wrap a:hover { text-decoration: underline; }
    .source-wrap code {
      font-family: monospace; background: rgba(255,255,255,.06);
      padding: 1px 5px; border-radius: 4px; font-size: 10px;
    }

    /* ── Country panel ───────────────────────────────────────────────────── */
    #country-panel {
      position: fixed; bottom: 24px; right: 24px; width: 320px;
      z-index: 100; display: none;
      background: var(--panel);
      backdrop-filter: blur(40px) saturate(1.6);
      -webkit-backdrop-filter: blur(40px) saturate(1.6);
      border: 1px solid var(--panel-border); border-radius: 22px;
      padding: 20px; box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }
    #country-panel.open {
      display: block;
      animation: slideUp .4s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes slideUp { from { transform: translateY(18px); opacity: 0; } }

    .cp-close {
      position: absolute; top: 12px; right: 12px;
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 8px; width: 28px; height: 28px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 12px; transition: all .15s;
    }
    .cp-close:hover { background: rgba(255,255,255,.1); color: var(--text); }
    .cp-name   { font-size: 16px; font-weight: 700; margin-bottom: 2px; padding-right: 32px; }
    .cp-metric { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
    .cp-val    { font-size: 34px; font-weight: 900; line-height: 1; margin-bottom: 8px; }
    .cp-bar-bg { background: rgba(255,255,255,.06); border-radius: 100px; height: 6px; margin-bottom: 16px; overflow: hidden; }
    .cp-bar    { height: 100%; border-radius: 100px; background: var(--accent); transition: width .6s cubic-bezier(.16,1,.3,1); }
    #chartWrap { height: 180px; margin-bottom: 8px; }
    .cp-src    { font-size: 10px; color: var(--muted); }

    /* ── Loading ─────────────────────────────────────────────────────────── */
    #loading {
      position: fixed; inset: 0; z-index: 999;
      background: var(--bg); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      transition: opacity .5s ease;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }
    .spin {
      width: 52px; height: 52px; border-radius: 50%;
      border: 2px solid rgba(124,109,250,.25);
      border-top-color: var(--accent);
      animation: rotate 1s linear infinite;
    }
    @keyframes rotate { to { transform: rotate(360deg); } }
    .load-txt { font-size: 13px; color: var(--muted); }

    /* ── MapLibre overrides ───────────────────────────────────────────────── */
    .maplibregl-ctrl-bottom-right { right: 8px; bottom: 8px; }
    .maplibregl-ctrl-bottom-left  { left: calc(var(--sidebar-w) + 8px); }
    .maplibregl-ctrl-attrib       { font-size: 10px; }
    .maplibregl-ctrl button { border-radius: 8px !important; }

    /* ── Mobile ───────────────────────────────────────────────────────────── */
    @media (max-width: 680px) {
      :root { --sidebar-w: 100vw; }
      #sidebar {
        top: auto; bottom: 0; height: 52vh;
        border-right: none; border-top: 1px solid var(--panel-border);
        animation: slideInUp .45s cubic-bezier(.16,1,.3,1) both;
      }
      @keyframes slideInUp { from { transform: translateY(100%); } }
      #country-panel { display: none !important; }
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="spin"></div>
  <div class="load-txt">Rendering globe…</div>
</div>

<div id="map"></div>

<aside id="sidebar">
  <div>
    <div class="hd-title">🌍 Visual Geography Intelligence</div>
    <div class="hd-sub"><span class="pulse-dot"></span>Real data · 258 countries · Open source</div>
  </div>

  <nav class="tab-nav" id="tabNav">
    <button class="tab-btn active" data-tab="explorer">Explorer</button>
    <button class="tab-btn" data-tab="climate">Climate</button>
    <button class="tab-btn" data-tab="health">Health</button>
    <button class="tab-btn" data-tab="humanitarian">Aid</button>
  </nav>

  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="🔍  Search country…" autocomplete="off" />
    <div id="suggestions"></div>
  </div>

  <div class="overlay-grid" id="overlayGrid"></div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Countries</div>
      <div class="stat-val" id="statCountries">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Average</div>
      <div class="stat-val" id="statAvg">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Highest</div>
      <div class="stat-val" id="statMax">—</div>
      <div class="stat-sub" id="statMaxSub"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Lowest</div>
      <div class="stat-val" id="statMin">—</div>
      <div class="stat-sub" id="statMinSub"></div>
    </div>
  </div>

  <div id="legendWrap" style="display:none">
    <div class="legend-label" id="legendLabel"></div>
    <div class="legend-bar"   id="legendBar"></div>
    <div class="legend-ticks">
      <span id="legendMin"></span>
      <span id="legendMid"></span>
      <span id="legendMax"></span>
    </div>
  </div>

  <div class="source-wrap" id="sourceWrap" style="display:none"></div>
</aside>

<div id="country-panel">
  <button class="cp-close" id="cpClose">✕</button>
  <div class="cp-name"   id="cpName">—</div>
  <div class="cp-metric" id="cpMetric">—</div>
  <div class="cp-val"    id="cpVal">—</div>
  <div class="cp-bar-bg"><div class="cp-bar" id="cpBar" style="width:0%"></div></div>
  <div id="chartWrap"><canvas id="topChart"></canvas></div>
  <div class="cp-src"    id="cpSrc"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

// ── State ─────────────────────────────────────────────────────────────────
const isoToId   = {};   // ISO3 → MapLibre feature id (integer)
const isoToName = {};   // ISO3 → country name
const isoToBounds = {}; // ISO3 → [[minLng,minLat],[maxLng,maxLat]]
const dataCache = {};   // overlay key → {data, min, max, unit, source, ...}
let activeOverlay = 'population';
let selectedIso   = null;
let hoveredId     = null;
let topChart      = null;

// ── Map ───────────────────────────────────────────────────────────────────
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/dark',
  center: [15, 20], zoom: 1.5, minZoom: 1,
  attributionControl: false,
});
map.addControl(new maplibregl.AttributionControl({compact: true}), 'bottom-right');
map.addControl(new maplibregl.NavigationControl({showCompass: false}), 'bottom-right');

map.on('style.load', async () => {
  try { map.setProjection({type: 'globe'}); } catch (_) {}
  try {
    map.setFog({
      color: 'rgba(2,4,14,0.8)',
      'high-color': '#000820',
      'horizon-blend': 0.06,
      'space-color': '#000000',
      'star-intensity': 0.15,
    });
  } catch (_) {}
  await loadGeoJSON();
  hideLoading();
  switchTab('explorer');
});

// ── GeoJSON ───────────────────────────────────────────────────────────────
async function loadGeoJSON() {
  const resp    = await fetch('data/countries.geojson');
  const geojson = await resp.json();

  geojson.features.forEach((f, i) => {
    const iso3 = f.properties[ISO3_KEY];
    const name = f.properties.name || '';
    if (!iso3) return;
    isoToId[iso3]   = i;
    isoToName[iso3] = name;
    const pts = flatCoords(f.geometry);
    if (pts.length) {
      const lngs = pts.map(c => c[0]), lats = pts.map(c => c[1]);
      isoToBounds[iso3] = [
        [Math.min(...lngs), Math.min(...lats)],
        [Math.max(...lngs), Math.max(...lats)],
      ];
    }
  });

  map.addSource('countries', {type: 'geojson', data: geojson, generateId: true});

  map.addLayer({
    id: 'countries-fill', type: 'fill', source: 'countries',
    paint: {'fill-color': 'rgba(255,255,255,0.04)', 'fill-opacity': 0.9},
  });
  map.addLayer({
    id: 'countries-hover', type: 'fill', source: 'countries',
    paint: {
      'fill-color': 'rgba(255,255,255,0.10)',
      'fill-opacity': ['case', ['boolean', ['feature-state','hover'],  false], 1, 0],
    },
  });
  map.addLayer({
    id: 'countries-line', type: 'line', source: 'countries',
    paint: {
      'line-color': ['case',
        ['boolean', ['feature-state','selected'], false], 'rgba(255,255,255,0.85)',
        'rgba(255,255,255,0.11)',
      ],
      'line-width': ['case',
        ['boolean', ['feature-state','selected'], false], 2, 0.5,
      ],
    },
  });

  map.on('mousemove',  'countries-fill', onHover);
  map.on('mouseleave', 'countries-fill', onLeave);
  map.on('click',      'countries-fill', onCountryClick);
}

function flatCoords(geo) {
  if (!geo) return [];
  if (geo.type === 'Polygon')      return geo.coordinates[0] || [];
  if (geo.type === 'MultiPolygon') return (geo.coordinates || []).flatMap(p => p[0] || []);
  return [];
}

// ── Hover / click ─────────────────────────────────────────────────────────
function onHover(e) {
  map.getCanvas().style.cursor = 'pointer';
  const id = e.features[0].id;
  if (hoveredId !== null && hoveredId !== id)
    map.setFeatureState({source:'countries', id: hoveredId}, {hover: false});
  hoveredId = id;
  map.setFeatureState({source:'countries', id}, {hover: true});
}

function onLeave() {
  map.getCanvas().style.cursor = '';
  if (hoveredId !== null) {
    map.setFeatureState({source:'countries', id: hoveredId}, {hover: false});
    hoveredId = null;
  }
}

function onCountryClick(e) {
  const f    = e.features[0];
  const iso3 = f.properties[ISO3_KEY];
  if (selectedIso && isoToId[selectedIso] !== undefined)
    map.setFeatureState({source:'countries', id: isoToId[selectedIso]}, {selected: false});
  selectedIso = iso3 || null;
  if (iso3 && isoToId[iso3] !== undefined)
    map.setFeatureState({source:'countries', id: isoToId[iso3]}, {selected: true});
  showCountryPanel(iso3);
}

// ── Tab switching ─────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab));

  const grid = document.getElementById('overlayGrid');
  grid.innerHTML = '';
  TABS[tab].overlays.forEach(key => {
    const m   = OVERLAY_META[key];
    const btn = document.createElement('button');
    btn.className = 'overlay-btn';
    btn.dataset.overlay = key;
    btn.innerHTML = `<span class="icon">${m.icon}</span>${m.label}`;
    btn.addEventListener('click', () => activateOverlay(key));
    grid.appendChild(btn);
  });

  activateOverlay(TABS[tab].overlays[0]);
}

// ── Overlay activation ────────────────────────────────────────────────────
async function activateOverlay(key) {
  activeOverlay = key;
  const m = OVERLAY_META[key];

  document.querySelectorAll('.overlay-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.overlay === key));

  // Gather data
  let data = {};
  if (m.prop) {
    Object.entries(COUNTRY_DATA).forEach(([iso3, d]) => {
      if (d[m.prop] !== undefined) data[iso3] = d[m.prop];
    });
  } else {
    if (!dataCache[key]) {
      try {
        const r = await fetch(`data/dashboards/${m.file}.json`);
        if (!r.ok) throw new Error();
        const j = await r.json();
        const nums = Object.values(j.data).filter(v => v !== null && !isNaN(+v)).map(Number);
        if (!nums.length) throw new Error();
        dataCache[key] = {
          data: j.data, min: Math.min(...nums), max: Math.max(...nums),
          unit: j.unit || '', source: j.source || m.source,
          sourceUrl: j.url || m.sourceUrl, license: j.license || m.license,
          year: j.year || m.year,
        };
      } catch {
        showPending(m);
        return;
      }
    }
    data = dataCache[key].data;
  }

  // Stats
  const nums    = Object.values(data).filter(v => v !== null && !isNaN(+v)).map(Number);
  if (!nums.length) { showPending(m); return; }
  const minVal  = Math.min(...nums);
  const maxVal  = Math.max(...nums);
  const avgVal  = nums.reduce((a, b) => a + b, 0) / nums.length;

  // Apply feature states (-1 = no data sentinel)
  Object.values(isoToId).forEach(id =>
    map.setFeatureState({source:'countries', id}, {value: -1}));
  Object.entries(data).forEach(([iso3, v]) => {
    const id = isoToId[iso3];
    if (id !== undefined && v !== null && !isNaN(+v))
      map.setFeatureState({source:'countries', id}, {value: +v});
  });

  // Paint expression
  const low  = `rgb(${m.colorLow.join(',')})`;
  const high = `rgb(${m.colorHigh.join(',')})`;
  map.setPaintProperty('countries-fill', 'fill-color', [
    'case',
    ['<=', ['coalesce', ['feature-state','value'], -1], -1],
    'rgba(255,255,255,0.04)',
    ['interpolate', ['linear'], ['coalesce', ['feature-state','value'], minVal],
      minVal, low, maxVal, high],
  ]);

  updateLegend(m, minVal, maxVal, low, high);
  updateStats(nums.length, avgVal, data, m);
  updateSource(m, key);

  if (selectedIso) showCountryPanel(selectedIso);
}

// ── Legend ────────────────────────────────────────────────────────────────
function updateLegend(m, minVal, maxVal, low, high) {
  document.getElementById('legendWrap').style.display = '';
  document.getElementById('legendLabel').textContent = `${m.label} · ${m.unit}`;
  document.getElementById('legendBar').style.background = `linear-gradient(90deg,${low},${high})`;
  document.getElementById('legendMin').textContent = m.format(minVal);
  document.getElementById('legendMid').textContent = m.format((minVal + maxVal) / 2);
  document.getElementById('legendMax').textContent = m.format(maxVal);
}

// ── Stats ─────────────────────────────────────────────────────────────────
function updateStats(count, avg, data, m) {
  animateCounter('statCountries', count);
  fadeTo('statAvg', m.format(avg), '');

  const pairs = Object.entries(data)
    .filter(([, v]) => v !== null && !isNaN(+v) && +v >= 0)
    .map(([k, v]) => [k, +v]);
  pairs.sort((a, b) => b[1] - a[1]);

  const top = pairs[0], bot = pairs[pairs.length - 1];
  fadeTo('statMax', top ? m.format(top[1]) : '—', top ? (isoToName[top[0]] || top[0]) : '');
  fadeTo('statMin', bot ? m.format(bot[1]) : '—', bot ? (isoToName[bot[0]] || bot[0]) : '');
}

// ── Source ────────────────────────────────────────────────────────────────
function updateSource(m, key) {
  const c   = dataCache[key];
  const src = document.getElementById('sourceWrap');
  src.style.display = '';
  src.innerHTML = `<strong style="color:var(--text)">${c ? c.source : m.source}</strong>
    &nbsp;·&nbsp;${c ? c.year : m.year}&nbsp;·&nbsp;${c ? c.license : m.license}<br>
    <a href="${c ? c.sourceUrl : m.sourceUrl}" target="_blank" rel="noopener">View source →</a>`;
}

function showPending(m) {
  document.getElementById('legendWrap').style.display = 'none';
  const src = document.getElementById('sourceWrap');
  src.style.display = '';
  src.innerHTML = `<span style="color:var(--warning)">⚠️ Dataset pending.</span><br>
    Run <code>python3 scripts/fetch_data.py</code> then refresh.`;
}

// ── Country panel ─────────────────────────────────────────────────────────
function showCountryPanel(iso3) {
  if (!iso3) return;
  const m    = OVERLAY_META[activeOverlay];
  const name = isoToName[iso3] || iso3;
  const c    = dataCache[activeOverlay];

  let val = null;
  if (m.prop && COUNTRY_DATA[iso3] !== undefined)
    val = COUNTRY_DATA[iso3][m.prop];
  else if (c && c.data[iso3] !== undefined)
    val = c.data[iso3];

  const allData = m.prop
    ? Object.fromEntries(Object.entries(COUNTRY_DATA).map(([k, d]) => [k, d[m.prop]]).filter(([,v]) => v !== undefined))
    : (c ? c.data : {});
  const allNums = Object.values(allData).filter(v => v !== null && !isNaN(+v)).map(Number);
  const maxAll  = allNums.length ? Math.max(...allNums) : 1;

  document.getElementById('cpName').textContent   = name;
  document.getElementById('cpMetric').textContent = `${m.label} · ${m.unit}`;
  document.getElementById('cpVal').textContent    = (val !== null && val !== undefined) ? m.format(+val) : 'No data';
  document.getElementById('cpBar').style.width    = (val !== null && maxAll > 0)
    ? Math.min((+val / maxAll) * 100, 100) + '%' : '0%';
  document.getElementById('cpSrc').textContent    = `${c ? c.source : m.source} · ${c ? c.year : m.year} · ${c ? c.license : m.license}`;

  renderTopChart(allData, m);

  const panel = document.getElementById('country-panel');
  panel.classList.remove('open');
  void panel.offsetWidth;
  panel.classList.add('open');
}

// ── Chart ─────────────────────────────────────────────────────────────────
function renderTopChart(data, m) {
  const top = Object.entries(data)
    .filter(([, v]) => v !== null && !isNaN(+v))
    .sort((a, b) => +b[1] - +a[1])
    .slice(0, 10);

  const n      = top.length || 1;
  const labels = top.map(([k])    => isoToName[k] || k);
  const values = top.map(([, v])  => +v);
  const colors = top.map((_, i)   => {
    const t = n > 1 ? i / (n - 1) : 0;
    return `rgba(${lrp(m.colorLow[0],m.colorHigh[0],t)},${lrp(m.colorLow[1],m.colorHigh[1],t)},${lrp(m.colorLow[2],m.colorHigh[2],t)},0.85)`;
  });

  if (topChart) topChart.destroy();
  topChart = new Chart(document.getElementById('topChart'), {
    type: 'bar',
    data: {labels, datasets: [{data: values, backgroundColor: colors, borderRadius: 4, borderSkipped: false}]},
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      animation: {duration: 550},
      plugins: {
        legend: {display: false},
        tooltip: {
          backgroundColor: 'rgba(8,12,28,.95)',
          titleColor: '#e8f0ff', bodyColor: '#6b85b0',
          borderColor: 'rgba(255,255,255,.07)', borderWidth: 1,
          callbacks: {label: ctx => m.format(ctx.raw)},
        },
      },
      scales: {
        x: {display: false},
        y: {
          grid: {display: false}, border: {display: false},
          ticks: {color: '#5a7498', font: {size: 10}},
        },
      },
    },
  });
}

// ── Helpers ───────────────────────────────────────────────────────────────
function lrp(a, b, t) { return Math.round(a + (b - a) * Math.max(0, Math.min(1, t))); }

function animateCounter(id, target) {
  const el    = document.getElementById(id);
  const start = parseInt(el.textContent) || 0;
  const t0    = performance.now();
  (function tick(now) {
    const p    = Math.min((now - t0) / 500, 1);
    const ease = 1 - (1 - p) ** 3;
    el.textContent = Math.round(start + (target - start) * ease);
    if (p < 1) requestAnimationFrame(tick);
  })(performance.now());
}

function fadeTo(id, val, sub) {
  const el  = document.getElementById(id);
  const sub_el = document.getElementById(id + 'Sub');
  el.style.opacity = '0';
  setTimeout(() => {
    el.textContent = val;
    if (sub_el) sub_el.textContent = sub;
    el.style.transition = 'opacity .28s';
    el.style.opacity = '1';
  }, 140);
}

function hideLoading() {
  const el = document.getElementById('loading');
  el.classList.add('fade-out');
  setTimeout(() => el.remove(), 600);
}

// ── Search ────────────────────────────────────────────────────────────────
const $search = document.getElementById('searchInput');
const $sug    = document.getElementById('suggestions');

$search.addEventListener('input', function () {
  const q = this.value.trim().toLowerCase();
  if (!q) { $sug.classList.remove('open'); return; }
  const hits = Object.entries(isoToName)
    .filter(([, n]) => n.toLowerCase().includes(q))
    .slice(0, 8);
  if (!hits.length) { $sug.classList.remove('open'); return; }
  $sug.innerHTML = hits.map(([iso3, name]) =>
    `<div class="sug-item" data-iso="${iso3}">${name}</div>`).join('');
  $sug.classList.add('open');
});

$sug.addEventListener('click', e => {
  const item = e.target.closest('.sug-item');
  if (!item) return;
  const iso3 = item.dataset.iso;
  $search.value = isoToName[iso3] || '';
  $sug.classList.remove('open');
  if (isoToBounds[iso3])
    map.fitBounds(isoToBounds[iso3], {
      padding: {top: 80, bottom: 80, left: Number(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w').replace('px','')) + 20 || 400, right: 60},
      maxZoom: 6, duration: 1200,
    });
  // Select
  if (isoToId[iso3] !== undefined) {
    if (selectedIso && isoToId[selectedIso] !== undefined)
      map.setFeatureState({source:'countries', id: isoToId[selectedIso]}, {selected: false});
    selectedIso = iso3;
    map.setFeatureState({source:'countries', id: isoToId[iso3]}, {selected: true});
    showCountryPanel(iso3);
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) $sug.classList.remove('open');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $search.value = ''; $sug.classList.remove('open'); $search.blur(); }
  if (e.key === '/' && document.activeElement !== $search) { e.preventDefault(); $search.focus(); }
});

// ── Country panel close ───────────────────────────────────────────────────
document.getElementById('cpClose').addEventListener('click', () => {
  document.getElementById('country-panel').classList.remove('open');
  if (selectedIso && isoToId[selectedIso] !== undefined)
    map.setFeatureState({source:'countries', id: isoToId[selectedIso]}, {selected: false});
  selectedIso = null;
});

// ── Tab nav ───────────────────────────────────────────────────────────────
document.getElementById('tabNav').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (btn) switchTab(btn.dataset.tab);
});
