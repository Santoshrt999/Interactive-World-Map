<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geospatial Analytics Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #050914;
      --panel: rgba(10, 16, 30, 0.88);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #edf4ff;
      --muted: #9bb2d6;
      --accent: #7e6bff;
      --accent-soft: rgba(126, 107, 255, 0.14);
      --success: #4fe2c8;
      --warning: #ffb65b;
      --danger: #ff5d77;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: Inter, system-ui, sans-serif; background: radial-gradient(circle at top, #080c1d 0%, #03050d 45%, #02030b 100%); color: var(--text); }
    body { overflow: hidden; }
    #map { position: absolute; inset: 0; z-index: 1; }
    .dashboard { position: absolute; top: 16px; left: 16px; width: min(420px, calc(100% - 32px)); max-height: calc(100% - 32px); display: grid; gap: 16px; z-index: 1000; }
    .panel { backdrop-filter: blur(30px); background: var(--panel); border: 1px solid var(--panel-border); border-radius: 28px; padding: 24px; box-shadow: 0 28px 80px rgba(0,0,0,0.28); overflow: hidden; }
    .panel h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: 0.02em; }
    .panel p { margin: 0 0 18px; line-height: 1.7; color: var(--muted); }
    .toolbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
    .toolbar button { border: none; border-radius: 16px; padding: 14px 16px; background: rgba(255,255,255,0.08); color: var(--text); cursor: pointer; transition: transform .18s ease, background .18s ease; font-weight: 600; }
    .toolbar button.active, .toolbar button:hover { background: linear-gradient(135deg, rgba(126,107,255,0.92), rgba(61,179,255,0.92)); transform: translateY(-1px); }
    .search-group { display: grid; gap: 10px; margin-bottom: 16px; }
    .search-group input { width: 100%; border: none; border-radius: 16px; padding: 14px 16px; background: rgba(255,255,255,0.08); color: var(--text); }
    .search-group button { border: none; border-radius: 16px; padding: 14px 18px; background: var(--accent); color: #fff; cursor: pointer; font-weight: 700; }
    .suggestions { max-height: 190px; overflow: auto; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); background: rgba(8,12,24,0.96); margin-bottom: 16px; }
    .suggestion { padding: 14px 16px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .suggestion:last-child { border-bottom: none; }
    .suggestion:hover { background: rgba(126,107,255,0.14); }
    .stats-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .metric-card { border-radius: 22px; padding: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06); }
    .metric-card h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
    .metric-card p { margin: 0; font-size: 22px; font-weight: 800; }
    .info-panel { margin-top: 18px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.05); padding: 18px; }
    .info-panel strong { display: block; margin-bottom: 10px; font-size: 14px; color: #fff; }
    .info-panel div { margin-bottom: 8px; color: var(--muted); }
    .legend { display: grid; gap: 10px; margin-top: 16px; }
    .legend-item { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
    .legend-swatch { width: 22px; height: 22px; border-radius: 10px; box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }
    .toplist { margin-top: 18px; padding: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06); border-radius: 22px; }
    .toplist h2 { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
    .top-item { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .top-item:last-child { border-bottom: none; }
    .top-item strong { color: #fff; }
    .status-chip { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 16px; background: rgba(126,107,255,0.18); color: #e9f2ff; font-size: 13px; }
    .leaflet-container { font: 14px/1.4 Inter, system-ui, sans-serif; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: rgba(8,12,24,0.96); color: #eef2ff; border:1px solid rgba(255,255,255,0.10); }
    .leaflet-popup-content p { margin:0; }
    .leaflet-tooltip { background: rgba(17, 24, 39, 0.96); color: #edf4ff; border:none; box-shadow: 0 12px 34px rgba(0,0,0,0.22); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="dashboard">
    <section class="panel">
      <div style="display:flex; justify-content:space-between; gap:16px; align-items:flex-start;">
        <div>
          <h1>Geospatial Analytics Dashboard</h1>
          <p>Interactive map analytics with legend-driven overlays, regional KPIs, and search-first navigation.</p>
        </div>
        <span class="status-chip" id="statusTag">Population overlay</span>
      </div>
      <div class="search-group">
        <input id="search" placeholder="Search city or country..." autocomplete="off" />
        <button id="zoomHome">Reset</button>
      </div>
      <div id="suggestions" class="suggestions"></div>
      <div class="toolbar">
        <button class="control-button active" data-mode="population">Population</button>
        <button class="control-button" data-mode="climate">Climate</button>
        <button class="control-button" data-mode="gdp">GDP</button>
      </div>
      <div class="stats-grid">
        <div class="metric-card"><h3>Current overlay</h3><p id="currentMode">Population</p></div>
        <div class="metric-card"><h3>Regions</h3><p id="regionCount">5</p></div>
        <div class="metric-card"><h3>Average</h3><p id="averageValue">—</p></div>
        <div class="metric-card"><h3>Selected</h3><p id="selectedValue">None</p></div>
      </div>
      <div class="info-panel">
        <strong id="infoTitle">Click a region to see details</strong>
        <div id="infoPopulation">Population: —</div>
        <div id="infoClimate">Avg temp: —</div>
        <div id="infoGdp">GDP: —</div>
      </div>
      <div class="legend" id="legend"></div>
    </section>
    <section class="panel toplist">
      <h2>Top 3 regions</h2>
      <div id="topList"></div>
    </section>
  </div>

    ];

    let geoData = null;
    let overlayLayer = null;
    let searchIndex = [...places];
    const map = L.map('map', { zoomControl: true, minZoom: 2, maxZoom: 18, zoomSnap: 0.5 }).setView([20, 0], 2);
    const baseLayers = {
      'Modern Streets': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }),
      'Night Mode': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', { attribution: '&copy; CARTO', maxZoom: 19 })
    };
    baseLayers['Modern Streets'].addTo(map);
    L.control.layers(baseLayers, null, { position: 'topright' }).addTo(map);

    let overlayMode = 'population';
    let selectedLayer = null;

    function styleFeature(feature) {
      return {
        fillColor: getOverlayColor(feature.properties),
        color: 'rgba(255,255,255,0.18)',
        weight: 0.7,
        fillOpacity: 0.55,
      };
    }

    function lerp(a, b, t) { return a + (b - a) * t; }
    function lerpColor(c1, c2, t) {
      return `rgb(${Math.round(lerp(c1[0], c2[0], t))},${Math.round(lerp(c1[1], c2[1], t))},${Math.round(lerp(c1[2], c2[2], t))})`;
    }

    function getOverlayColor(properties) {
      const value = properties[overlayMode] || 0;
      if (overlayMode === 'population') {
        // light blue → deep blue (no red/orange)
        const t = Math.min(value / 1450, 1);
        return lerpColor([210, 235, 255], [20, 80, 180], t);
      }
      if (overlayMode === 'climate') {
        // cool teal → warm amber (intuitive cool-to-hot)
        const t = Math.min(Math.max((value + 5) / 37, 0), 1);
        return lerpColor([100, 210, 200], [240, 160, 40], t);
      }
      if (overlayMode === 'gdp') {
        // pale green → deep green (no purple)
        const t = Math.min(value / 25000, 1);
        return lerpColor([210, 245, 220], [20, 130, 70], t);
      }
      return '#b0bec5';
    }

    function highlightFeature(layer) {
      layer.setStyle({ weight: 2.7, color: '#ffffff', fillOpacity: 0.92 });
      if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
        layer.bringToFront();
      }
    }

    function resetHighlight(layer) {
      if (selectedLayer === layer) {
        layer.setStyle({ weight: 2.7, color: '#ffffff', fillOpacity: 0.92 });
      } else if (overlayLayer) {
        overlayLayer.resetStyle(layer);
      }
    }

    function selectFeature(feature, layer) {
      if (selectedLayer) {
        overlayLayer.resetStyle(selectedLayer);
      }
      selectedLayer = layer;
      layer.setStyle({ weight: 2.7, color: '#ffffff', fillOpacity: 0.92 });
      updateDashboard(feature.properties.name, feature.properties);
      layer.openPopup();
    }

    function onEachFeature(feature, layer) {
      layer.on({
        mouseover: () => highlightFeature(layer),
        mouseout: () => resetHighlight(layer),
        click: () => selectFeature(feature, layer)
      });
      layer.bindPopup(`<strong>${feature.properties.name}</strong><br>${formatOverlayValue(feature.properties)}`);
      layer.bindTooltip(feature.properties.name, { direction: 'center', permanent: false, className: 'tooltip-label' });
    }

    function formatOverlayValue(properties) {
      if (overlayMode === 'population') return `Population ${properties.population}M`;
      if (overlayMode === 'climate') return `Avg temp ${properties.climate}°C`;
      if (overlayMode === 'gdp') return `GDP $${properties.gdp}B`;
      return '';
    }

    function updateDashboard(name, properties) {
      document.getElementById('currentMode').textContent = `${name} — ${capitalize(overlayMode)}`;
      document.getElementById('selectedValue').textContent = formatOverlayValue(properties);
      document.getElementById('infoTitle').textContent = name;
      document.getElementById('infoPopulation').textContent = `Population: ${properties.population} M`;
      document.getElementById('infoClimate').textContent = `Avg temp: ${properties.climate} °C`;
      document.getElementById('infoGdp').textContent = `GDP: $${properties.gdp} B`;
      updateLegend();
      updateTopMetrics();
    }

    function updateOverlay() {
      if (!overlayLayer) return;
      overlayLayer.setStyle(styleFeature);
      document.getElementById('statusTag').textContent = `${capitalize(overlayMode)} overlay`;
      document.getElementById('currentMode').textContent = capitalize(overlayMode);
      if (selectedLayer) selectFeature(selectedLayer.feature, selectedLayer);
      updateLegend();
      updateTopMetrics();
    }

    function updateLegend() {
      const legend = document.getElementById('legend');
      legend.innerHTML = '';
      const stops = overlayMode === 'population'
        ? [{ color: 'rgb(20,80,180)',  label: '1B+ people' }, { color: 'rgb(110,155,215)', label: '~300M people' }, { color: 'rgb(210,235,255)', label: '<50M people' }]
        : overlayMode === 'climate'
          ? [{ color: 'rgb(240,160,40)', label: 'Hot (>25°C)' }, { color: 'rgb(170,185,120)', label: 'Warm (~15°C)' }, { color: 'rgb(100,210,200)', label: 'Cool (<5°C)' }]
          : [{ color: 'rgb(20,130,70)',  label: '>$10T GDP' }, { color: 'rgb(115,188,145)', label: '~$1T GDP' }, { color: 'rgb(210,245,220)', label: '<$100B GDP' }];
      stops.forEach(item => {
        const badge = document.createElement('div');
        badge.className = 'legend-item';
        badge.innerHTML = `<span class='legend-swatch' style='background:${item.color}'></span>${item.label}`;
        legend.appendChild(badge);
      });
    }

    function updateTopMetrics() {
      if (!geoData) return;
      const sorted = geoData.features.slice().sort((a, b) => b.properties[overlayMode] - a.properties[overlayMode]);
      document.getElementById('regionCount').textContent = sorted.length;
      document.getElementById('averageValue').textContent = `${Math.round(sorted.reduce((sum, feature) => sum + feature.properties[overlayMode], 0) / sorted.length)}${overlayMode === 'gdp' ? 'B' : overlayMode === 'population' ? 'M' : '°C'}`;
      document.getElementById('topList').innerHTML = sorted.slice(0, 3).map(feature => `
        <div class='top-item'>
          <div>${feature.properties.name}</div>
          <strong>${feature.properties[overlayMode]}${overlayMode === 'gdp' ? 'B' : overlayMode === 'population' ? 'M' : '°C'}</strong>
        </div>
      `).join('');
    }

    function createCityMarkers() {
      return places.map(city => L.circleMarker([city.lat, city.lon], {
        radius: 6,
        fillColor: '#ffe64d',
        color: '#ffffff',
        weight: 1,
        fillOpacity: 0.88,
      }).bindTooltip(`<strong>${city.label}</strong>`, { direction: 'top' }));
    }

    function capitalize(value) {
      return value.charAt(0).toUpperCase() + value.slice(1);
    }

    function hashString(value) {
      let hash = 0;
      for (let i = 0; i < value.length; i += 1) {
        hash = ((hash << 5) - hash) + value.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    function getFeatureCentroid(feature) {
      let latSum = 0;
      let lonSum = 0;
      let count = 0;
      function accumulate(coords) {
        if (typeof coords[0] === 'number') {
          lonSum += coords[0];
          latSum += coords[1];
          count += 1;
        } else {
          coords.forEach(accumulate);
        }
      }
      accumulate(feature.geometry.coordinates);
      return count ? [lonSum / count, latSum / count] : [0, 0];
    }

    function getFeatureBounds(feature) {
      let minLat = 90;
      let maxLat = -90;
      let minLon = 180;
      let maxLon = -180;
      function measure(coords) {
        if (typeof coords[0] === 'number') {
          minLon = Math.min(minLon, coords[0]);
          maxLon = Math.max(maxLon, coords[0]);
          minLat = Math.min(minLat, coords[1]);
          maxLat = Math.max(maxLat, coords[1]);
        } else {
          coords.forEach(measure);
        }
      }
      measure(feature.geometry.coordinates);
      return [[minLat, minLon], [maxLat, maxLon]];
    }

    };

    function enrichFeature(feature) {
      const iso3 = feature.properties['ISO3166-1-Alpha-3'] || '';
      const name = feature.properties.name || 'Unknown';
      feature.properties.name = name;
      const centroid = getFeatureCentroid(feature);

      if (COUNTRY_DATA[iso3]) {
        const d = COUNTRY_DATA[iso3];
        feature.properties.population = d.population;
        feature.properties.gdp = d.gdp;
        feature.properties.climate = d.climate;
      } else {
        const baseHash = hashString(name);
        feature.properties.population = Math.max(0.1, Math.round((1 + (baseHash % 25)) * 10) / 10);
        feature.properties.climate = Math.max(-5, Math.min(32, Math.round((30 - Math.abs(centroid[1]) * 0.4 + ((baseHash % 11) - 5) * 0.4) * 10) / 10));
        feature.properties.gdp = Math.max(1, Math.round(feature.properties.population * (2 + (baseHash % 15))));
      }

      feature.bounds = getFeatureBounds(feature);
      return feature;
    }

    function buildSearchIndex() {
      searchIndex = [...places];
      if (geoData) {
        geoData.features.forEach(feature => {
          searchIndex.push({ label: feature.properties.name, bounds: feature.bounds, feature });
        });
      }
    }

    async function initializeDashboard() {
      document.getElementById('statusTag').textContent = 'Loading country dataset...';
      try {
        const response = await fetch('./data/countries.geojson');
        const data = await response.json();
        data.features = data.features.map(enrichFeature);
        geoData = data;
        overlayLayer = L.geoJSON(geoData, { style: styleFeature, onEachFeature }).addTo(map);
        buildSearchIndex();
        updateLegend();
        updateTopMetrics();
        document.getElementById('statusTag').textContent = `${capitalize(overlayMode)} overlay`;
      } catch (error) {
        console.error('Could not load dataset:', error);
        document.getElementById('statusTag').textContent = 'Dataset load failed';
      }
    }

    document.querySelectorAll('.control-button').forEach(button => {
      button.addEventListener('click', () => {
        overlayMode = button.dataset.mode;
        document.querySelectorAll('.control-button').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        updateOverlay();
      });
    });

    const searchInput = document.getElementById('search');
    const suggestions = document.getElementById('suggestions');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim().toLowerCase();
      suggestions.innerHTML = '';
      if (!query) return;
      searchIndex.filter(item => item.label.toLowerCase().includes(query)).slice(0, 8).forEach(item => {
        const div = document.createElement('div');
        div.className = 'suggestion';
        div.textContent = item.label;
        div.addEventListener('click', () => {
          if (item.bounds) {
            map.fitBounds(item.bounds, { padding: [30, 30] });
          } else {
            map.flyTo([item.lat, item.lon], 5, { animate: true, duration: 0.8 });
          }
          if (item.feature && overlayLayer) {
            const layer = overlayLayer.getLayers().find(l => l.feature.properties.name === item.label);
            if (layer) selectFeature(item.feature, layer);
          }
          searchInput.value = item.label;
          suggestions.innerHTML = '';
        });
        suggestions.appendChild(div);
      });
    });

    document.getElementById('zoomHome').addEventListener('click', () => {
      map.flyTo([20, 0], 2, { animate: true, duration: 0.8 });
      searchInput.value = '';
      suggestions.innerHTML = '';
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-group') && !e.target.closest('.suggestions')) {
        suggestions.innerHTML = '';
      }
    });

    document.addEventListener('keydown', (e) => {
      if ((e.key === '/' || (e.ctrlKey && e.key === 'f')) && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === 'Escape') {
        searchInput.value = '';
        suggestions.innerHTML = '';
        searchInput.blur();
      }
    });

    createCityMarkers().forEach(marker => marker.addTo(map));
    initializeDashboard();
  </script>
</body>
